name: Windows build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Visual Studio 2026 and MSVC v145
        shell: cmd
        run: |
          call diagnostics\vs-env.cmd
          if errorlevel 1 exit /b 1
          echo MSVC %VCToolsVersion% for %VSCMD_ARG_TGT_ARCH%
          msbuild -version
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: '7.0.1'
      - name: Restore pinned packages and build Release x64 with W4 WX
        shell: cmd
        run: build.cmd
      - name: Native regression suites
        shell: pwsh
        run: ./diagnostics/run-ci-tests.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Restore browser dependencies
        run: npm ci
      - name: Headless Edge regression suites
        shell: pwsh
        run: |
          $edge = "${env:ProgramFiles(x86)}/Microsoft/Edge/Application/msedge.exe"
          if (!(Test-Path $edge)) { throw 'Expected runner Microsoft Edge installation missing' }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node diagnostics/verify-ui.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and verify portable ZIP
        shell: pwsh
        run: ./diagnostics/package-portable.ps1 -Commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: GlassSplit-Windows-x64
          path: artifacts/GlassSplit-Windows-x64.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref == 'refs/heads/main' && 'dev-latest' || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassSplit-Windows-x64
          path: artifacts
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const development = context.ref === 'refs/heads/main';
            const tag = development ? 'dev-latest' : context.ref.slice('refs/tags/'.length);
            const sha = context.sha;
            if (!development && !/^v\d+\.\d+\.\d+$/.test(tag)) {
              core.setFailed('Version tags must have the form v1.2.3'); return;
            }
            if (development) {
              const head = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
              if (head.data.object.sha !== sha) {
                core.notice('Skipping superseded main build'); return;
              }
              let exists = true;
              try {
                await github.rest.git.getRef({owner, repo, ref: 'tags/dev-latest'});
              } catch (error) { if (error.status !== 404) throw error; exists = false; }
              // Force updates are restricted to this disposable development tag.
              if (exists) {
                await github.rest.git.updateRef({owner, repo, ref: 'tags/dev-latest', sha, force: true});
              } else {
                await github.rest.git.createRef({owner, repo, ref: 'refs/tags/dev-latest', sha});
              }
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner, repo, tag})).data;
            } catch (error) { if (error.status !== 404) throw error; }
            if (!development && release) {
              core.setFailed('Versioned release already exists; refusing to overwrite it'); return;
            }
            const body = development
              ? `Portable Windows x64 build from commit ${sha}.\n\n[Build and tests](https://github.com/${owner}/${repo}/actions/runs/${context.runId}).\n\nRequires WebView2 Evergreen Runtime. Extract the ZIP and run GlassSplit/Dock.exe.`
              : (await github.rest.repos.generateReleaseNotes({owner, repo, tag_name: tag, target_commitish: sha})).data.body;
            const fields = {owner, repo, name: development ? 'Development build' : tag,
              body, prerelease: development, draft: false};
            release = release
              ? (await github.rest.repos.updateRelease({...fields, release_id: release.id})).data
              : (await github.rest.repos.createRelease({...fields, tag_name: tag, target_commitish: sha})).data;
            const name = 'GlassSplit-Windows-x64.zip';
            for (const asset of release.assets.filter(a => a.name === name)) {
              await github.rest.repos.deleteReleaseAsset({owner, repo, asset_id: asset.id});
            }
            const data = fs.readFileSync(`artifacts/${name}`);
            await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id,
              name, data, headers: {'content-type': 'application/zip', 'content-length': data.length}});
